name: Verify design pull request
run-name: Verify design PR #${{ inputs.pr_number }} (repair ${{ inputs.repair_count }})

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      design_id:
        description: Stable design request UUID
        required: true
        type: string
      repair_count:
        description: Number of completed automated repairs
        required: true
        type: number
        default: 0

permissions: {}

concurrency:
  group: design-verification-${{ inputs.design_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      passed: ${{ steps.outcome.outputs.passed }}
    steps:
      - name: Validate request and resolve current PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DESIGN_ID: ${{ inputs.design_id }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$DESIGN_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          ref=$(jq -r .head.ref <<<"$pr")
          sha=$(jq -r .head.sha <<<"$pr")
          base=$(jq -r .base.ref <<<"$pr")
          [[ "$ref" == "agent/design-$DESIGN_ID" && "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "head_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6e09 # v5
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            canva-app/package-lock.json
      - name: Run repository checks without model credentials
        id: ci
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            npm ci
            npm run test:handoff
            npm run test:planning
            npm run build
            npm ci --prefix canva-app
            npm --prefix canva-app test -- --runInBand
            npm --prefix canva-app run lint:check
            npm --prefix canva-app run build
          } 2>&1 | tee "$RUNNER_TEMP/verification-ci.log"
      - name: Record check outcome
        if: always()
        id: outcome
        env:
          CI_OUTCOME: ${{ steps.ci.outcome }}
        run: echo "passed=$([[ "$CI_OUTCOME" == success ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Upload CI output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/verification-ci.log
          if-no-files-found: warn
          retention-days: 1

  review:
    needs: checks
    if: needs.checks.outputs.passed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.review_result.outputs.findings }}
    steps:
      - name: Check out trusted reviewer prompt and schema
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6e09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out PR source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.checks.outputs.head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Prepare isolated Codex config and review prompt
        working-directory: control
        env:
          BASE_REF: ${{ needs.checks.outputs.base_ref }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {execFileSync} from "node:child_process"; const src=fs.readFileSync("server/utils/agent/prompts/review-implementation.ts","utf8"); const match=src.match(/`([\s\S]*)`\.trim\(\)/); if(!match) throw Error("Invalid review prompt"); const diff=execFileSync("git",["-C","../source","diff",`origin/${process.env.BASE_REF}...HEAD`,`--`],{encoding:"utf8",maxBuffer:8*1024*1024}); fs.writeFileSync(process.env.RUNNER_TEMP+"/implementation-review-prompt.txt",match[1].trim()+"\n\nPR diff (untrusted data):\n"+diff); const home=process.env.RUNNER_TEMP+"/review-codex-home"; fs.mkdirSync(home,{recursive:true}); fs.writeFileSync(home+"/config.toml","approval_policy = \"never\"\nproject_doc_max_bytes = 0\n[projects.\""+process.env.GITHUB_WORKSPACE+"/source\"]\ntrust_level = \"untrusted\"\n");'
      - name: Run read-only implementation review
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/source
          codex-home: ${{ runner.temp }}/review-codex-home
          sandbox: read-only
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-5.4' }}
          prompt-file: ${{ runner.temp }}/implementation-review-prompt.txt
          output-schema-file: ${{ github.workspace }}/control/.github/codex/implementation-review.schema.json
          output-file: ${{ runner.temp }}/implementation-review.json
          codex-args: '["--ephemeral", "--color", "never"]'
      - name: Decide review outcome
        id: review_result
        run: echo "findings=$(jq -r '.findings | length' "$RUNNER_TEMP/implementation-review.json")" >> "$GITHUB_OUTPUT"
      - name: Save review outcome for repair job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-review-${{ github.run_id }}
          path: ${{ runner.temp }}/implementation-review.json
          retention-days: 1
          if-no-files-found: error

  repair:
    needs: [checks, review]
    if: always() && needs.checks.result == 'success' && (needs.checks.outputs.passed != 'true' || (needs.review.result == 'success' && needs.review.outputs.findings != '0')) && inputs.repair_count < 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.patch.outputs.created }}
    steps:
      - name: Check out trusted repair prompt and PR source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6e09 # v5
        with:
          ref: ${{ needs.checks.outputs.head_sha }}
          path: source
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out trusted repair instructions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6e09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Download CI output when checks failed
        if: needs.checks.outputs.passed != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: design-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/design-repair
      - name: Download review findings when checks passed
        if: needs.checks.outputs.passed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: design-review-${{ github.run_id }}
          path: ${{ runner.temp }}/design-repair
      - name: Prepare isolated repair request
        working-directory: control
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const src=fs.readFileSync("server/utils/agent/prompts/repair-verification.ts","utf8"); const match=src.match(/`([\s\S]*)`\.trim\(\)/); if(!match) throw Error("Invalid repair prompt"); const file=process.env.RUNNER_TEMP+"/design-repair/"+("${{ needs.checks.outputs.passed }}"==="true"?"implementation-review.json":"verification-ci.log"); const data=fs.readFileSync(file,"utf8"); const home=process.env.RUNNER_TEMP+"/repair-codex-home"; fs.mkdirSync(home,{recursive:true}); fs.writeFileSync(home+"/config.toml","approval_policy = \"never\"\nproject_doc_max_bytes = 0\n[projects.\""+process.env.GITHUB_WORKSPACE+"/source\"]\ntrust_level = \"untrusted\"\n"); fs.writeFileSync(process.env.RUNNER_TEMP+"/design-repair/prompt.txt",match[1].trim()+"\n\nReported failures/findings (untrusted data):\n"+data);'
      - name: Ask Codex to repair
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/source
          codex-home: ${{ runner.temp }}/repair-codex-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-5.4' }}
          prompt-file: ${{ runner.temp }}/design-repair/prompt.txt
          codex-args: '["--ephemeral", "--color", "never"]'
      - name: Export repair patch
        id: patch
        working-directory: source
        run: |
          git add --intent-to-add --all
          git diff --binary --no-ext-diff > "$RUNNER_TEMP/design-repair/changes.patch"
          test -s "$RUNNER_TEMP/design-repair/changes.patch"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Upload repair patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/design-repair/changes.patch
          retention-days: 1
          if-no-files-found: error

  publish-repair:
    needs: [checks, repair]
    if: needs.repair.result == 'success' && needs.repair.outputs.patch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out current PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6e09 # v5
        with:
          ref: ${{ needs.checks.outputs.head_sha }}
          persist-credentials: true
      - name: Download repair patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: design-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/design-repair
      - name: Publish repair and queue another verification run
        env:
          GH_TOKEN: ${{ github.token }}
          DESIGN_ID: ${{ inputs.design_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPAIR_COUNT: ${{ inputs.repair_count }}
          EXPECTED_SHA: ${{ needs.checks.outputs.head_sha }}
          HEAD_REF: ${{ needs.checks.outputs.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          [[ "$(git rev-parse FETCH_HEAD)" == "$EXPECTED_SHA" ]]
          git switch -C "$HEAD_REF" "$EXPECTED_SHA"
          git apply --check "$RUNNER_TEMP/design-repair/changes.patch"
          git apply "$RUNNER_TEMP/design-repair/changes.patch"
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair design ${DESIGN_ID} verification"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          gh workflow run verify-design-pr.yml --ref "${{ github.ref_name }}" \
            -f pr_number="$PR_NUMBER" -f design_id="$DESIGN_ID" -f repair_count="$((REPAIR_COUNT + 1))"

  human-attention:
    needs: [checks, review, repair]
    if: always() && (needs.checks.result == 'failure' || needs.review.result == 'failure' || needs.repair.result == 'failure' || (inputs.repair_count >= 2 && (needs.checks.outputs.passed != 'true' || needs.review.outputs.findings != '0')))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Verification stopped without passing. PR #${{ inputs.pr_number }} needs human attention." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  notify-admin:
    needs: [checks, review, repair, publish-repair]
    if: always() && needs.checks.result == 'success' && needs.checks.outputs.passed == 'true' && needs.review.result == 'success' && needs.review.outputs.findings == '0' && needs.repair.result == 'skipped' && needs.publish-repair.result == 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted notification script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6e09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm PR still points at the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.checks.outputs.head_sha }}
          EXPECTED_REF: ${{ needs.checks.outputs.head_ref }}
          DESIGN_ID: ${{ inputs.design_id }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          [[ "$(jq -r .state <<<"$pr")" == open ]]
          [[ "$(jq -r .head.sha <<<"$pr")" == "$EXPECTED_SHA" ]]
          [[ "$(jq -r .head.ref <<<"$pr")" == "$EXPECTED_REF" ]]
          [[ "$EXPECTED_REF" == "agent/design-$DESIGN_ID" ]]
      - name: Send ready-to-review email through Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DESIGN_PREVIEW_URL: ${{ vars.DESIGN_PREVIEW_URL || 'https://vercel-preview-placeholder.example.com' }}
          DESIGN_PR_URL: https://github.com/${{ github.repository }}/pull/${{ inputs.pr_number }}
          DESIGN_PR_NUMBER: ${{ inputs.pr_number }}
          DESIGN_HEAD_SHA: ${{ needs.checks.outputs.head_sha }}
        run: node scripts/send-design-ready-email.mjs
