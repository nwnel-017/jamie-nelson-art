# This workflow turns an approved design request into a proposed code change.
# It claims the job, asks Codex to create technical instructions, then asks
# Codex to implement them. The changes are submitted as a pull request for review.
# The workflow also reports the planning result to the backend.

name: Generate technical design instructions
run-name: Technical design job ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing technical_design_jobs UUID
        required: true
        type: string
      base_branch:
        description: Configured source branch for the pull request
        required: true
        type: string
      design_id:
        description: Stable design_requests UUID
        required: true
        type: string

permissions: {}

# Do not cancel a job whose only permitted model attempt has already started.
concurrency:
  group: technical-design-${{ inputs.design_id }}
  cancel-in-progress: false

env:
  TECHNICAL_JOBS_BACKEND_URL: ${{ vars.TECHNICAL_JOBS_BACKEND_URL }}
  TECHNICAL_JOB_ID: ${{ inputs.job_id }}

jobs:
  claim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
      repository_sha: ${{ steps.claim.outputs.repository_sha }}
      model: ${{ steps.claim.outputs.model }}
    steps:
      - name: Check out trusted worker code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Claim one generation attempt and retrieve approved draft
        id: claim
        run: node scripts/technical-design-job-worker.mjs claim
      - name: Transfer approved input to isolated planner job
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: technical-design-input-${{ github.run_id }}
          path: ${{ runner.temp }}/technical-design-job/input.json
          retention-days: 1
          if-no-files-found: error

  plan:
    needs: claim
    if: needs.claim.outputs.claimed == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    # This job cannot mint a backend identity token. No backend/database or
    # GitHub dispatch credential is provided to the model process.
    permissions:
      contents: read
    steps:
      - name: Check out trusted prompt and worker
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out the repository version approved for planning
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.claim.outputs.repository_sha }}
          path: source
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download approved request
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: technical-design-input-${{ github.run_id }}
          path: ${{ runner.temp }}/technical-design-job
      - name: Prepare fixed developer instructions and request data
        env:
          TECHNICAL_JOBS_SOURCE_DIRECTORY: ${{ github.workspace }}/source
          TECHNICAL_JOBS_PROMPT_FILE: ${{ github.workspace }}/control/server/utils/agent/prompts/technical-instructions.ts
        run: node control/scripts/technical-design-job-worker.mjs prepare
      - name: Inspect source and generate technical instructions once
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/source
          codex-home: ${{ runner.temp }}/technical-design-job/codex-home
          sandbox: read-only
          safety-strategy: drop-sudo
          model: ${{ needs.claim.outputs.model }}
          prompt-file: ${{ runner.temp }}/technical-design-job/prompt.txt
          output-schema-file: ${{ github.workspace }}/control/.github/codex/technical-instructions.schema.json
          output-file: ${{ runner.temp }}/technical-design-job/technical-instructions.json
          codex-args: '["--ephemeral", "--color", "never"]'
      - name: Transfer instructions to isolated reporting job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: technical-design-result-${{ github.run_id }}
          path: ${{ runner.temp }}/technical-design-job/technical-instructions.json
          retention-days: 1
          if-no-files-found: error

  implement:
    needs: [claim, plan]
    if: needs.plan.result == 'success' && needs.claim.outputs.claimed == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    permissions:
      contents: read
    steps:
      - name: Check out trusted execution prompt
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Resolve the current feature branch base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          DESIGN_ID: ${{ inputs.design_id }}
          DEFAULT_BRANCH: ${{ inputs.base_branch }}
        run: |
          [[ "$DESIGN_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          branch="agent/design-${DESIGN_ID}"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$branch" --jq ".[] | select(.ref == \"refs/heads/$branch\") | .object.sha" 2>/dev/null || true)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out selected execution base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: source
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download generated instructions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: technical-design-result-${{ github.run_id }}
          path: ${{ runner.temp }}/technical-design-job
      - name: Build execution prompt
        env:
          TECHNICAL_EXECUTION_PROMPT_FILE: ${{ github.workspace }}/control/server/utils/agent/prompts/execute-technical-instructions.ts
        run: |
          node control/scripts/prepare-design-execution.mjs
      - name: Implement approved instructions
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/source
          codex-home: ${{ runner.temp }}/technical-design-job/executor-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          model: ${{ needs.claim.outputs.model }}
          prompt-file: ${{ runner.temp }}/technical-design-job/execution-prompt.txt
          codex-args: '["--ephemeral", "--color", "never"]'
      - name: Export generated patch
        working-directory: source
        run: |
          git add --intent-to-add --all
          git diff --binary --no-ext-diff > "$RUNNER_TEMP/technical-design-job/changes.patch"
      - name: Transfer patch to isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: technical-design-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/technical-design-job/changes.patch
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [claim, implement]
    if: needs.implement.result == 'success' && needs.claim.outputs.claimed == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out trusted patch validator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out selected execution base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source
          ref: ${{ needs.implement.outputs.base_sha }}
          persist-credentials: true
          token: ${{ github.token }}
      - name: Download generated patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: technical-design-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/technical-design-job
      - name: Create feature branch and commit changes
        env:
          JOB_ID: ${{ inputs.job_id }}
          DESIGN_ID: ${{ inputs.design_id }}
        run: |
          [[ "$DESIGN_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          node ../control/scripts/validate-design-patch.mjs "$RUNNER_TEMP/technical-design-job/changes.patch"
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "agent/design-${DESIGN_ID}"
          git add -A
          git commit -m "Implement technical design ${JOB_ID}"
          git push --set-upstream origin "agent/design-${DESIGN_ID}"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          DESIGN_ID: ${{ inputs.design_id }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          branch="agent/design-${DESIGN_ID}"
          existing=$(gh pr list --base "$BASE_BRANCH" --head "$branch" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "Update design ${DESIGN_ID}" --body "Updated by technical design job ${JOB_ID}. Please review the latest changes."
            pr_number="$existing"
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "Design ${DESIGN_ID}" --body "Automated implementation from technical design job ${JOB_ID}. Please review before merging."
            pr_number=$(gh pr list --base "$BASE_BRANCH" --head "$branch" --json number --jq '.[0].number')
          fi
          head_sha=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" -f state=pending -f context=design-verification -f description="Awaiting design verification"
          gh workflow run verify-design-pr.yml --ref "$WORKFLOW_REF" \
            -f pr_number="$pr_number" -f design_id="$DESIGN_ID" -f repair_count=0

  report:
    needs: [claim, plan]
    if: always() && needs.claim.outputs.claimed == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted reporting code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download completed instructions
        if: needs.plan.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: technical-design-result-${{ github.run_id }}
          path: ${{ runner.temp }}/technical-design-job
      - name: Save the planning outcome through the backend
        if: always()
        env:
          TECHNICAL_PLANNER_RESULT: ${{ needs.plan.result }}
        run: node scripts/technical-design-job-worker.mjs result
